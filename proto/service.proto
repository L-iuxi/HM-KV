syntax = "proto3";

package proto;

option go_package = "/proto;proto";

//kv相关接口
service Kv {
    rpc Put(PutRequest) returns (PutReply);
    rpc Get(GetRequest) returns (GetReply);
    rpc Delete(DeleteRequest) returns (DeleteReply);
    rpc Batch(BatchRequest) returns (BatchReply);
    rpc Watch(WatchRequest) returns (stream WatchReply);
    rpc Compact(CompactRequest) returns (CompactReply);
    rpc KeepAlive(KeepAliveRequest) returns (KeepAliveReply);
    rpc Grant(GrantRequest) returns (GrantReply);
    rpc AddMember(AddMemberRequest) returns(AddMemberReply);
    rpc DeleteMember(DeleteMemberRequest) returns(DeleteMemberReply);
    rpc Txn(TxnRequest) returns(TxnReply);
    rpc Lock(LockRequest) returns(LockReply);
    rpc Unlock(UnlockRequest) returns(UnlockReply);
}

//raft相关接口
service Raft {
    // 选举
    rpc RequestVote (RequestVoteArgs) returns (RequestVoteReply);

    // 心跳 / 日志复制
    rpc AppendEntries (HeartbeatArgs) returns (HeartbeatReply);

    // 快照
    rpc InstallSnapshot (InstallSnapshotArgs) returns (InstallSnapshotReply);
}

enum ErrorType{
    OK = 0;
    WRONG_LEADER = 1;
    KEY_NOT_EXIST = 2;
    WRONG_VERSION = 3;
    INTERNAL_ERROR = 4;
    COMPACT_ERROR = 5;
    INVALID_ARGUMENT=6;
    MEMBER_ALREADY_EXISTS = 7;
    MEMBER_NOT_FOUND = 8;
    TIMEOUT = 9;
    LEASE_NO_EXIST = 10;
    LOCK_EXIST = 11;
}

enum CompareType{
    LESS = 0;
    GREATER = 1;
    EQUAL = 2;
    NOT_EQUAL = 3;
}

message Compare{
    string key = 1;
    CompareType compare_type = 2;
    int64 version = 3;//比较目标version
}

//txn事务请求
message TxnRequest{
    repeated Compare compare = 1;
    repeated Entry success = 2;//compare全过执行
    repeated Entry failed = 3;//compatre失败执行
    int64 client_id = 4;
    int64 request_id = 5;
}

message TxnReply{
    ErrorType error = 1;
    repeated KeyValue results = 2;
    int64 leader_id = 3;
    bool succeeded = 4;
}

//分布式锁
message LockRequest {
    string key = 1;
    int64 lease_id = 2;
    int64 client_id = 3;
    int64 request_id = 4;
}

message LockReply {
    bool success = 1;
    int64 revision = 2;
    ErrorType error = 3;
    int64 leader_id = 4;
}

// 释放锁
message UnlockRequest {
    string lock_key = 1;       // Lock 生成的内部 key（/lock/<key>/<client>-<request>）
    int64 version = 2;         // LockReply.revision，CAS 校验
    int64 client_id = 3;
    int64 request_id = 4;
}

message UnlockReply {
    bool success = 1;
    ErrorType error = 2;
    int64 leader_id = 3;
}

//watch请求
message WatchRequest{
    string key = 1;
    int64 start_reversion = 2;//从哪个版本开始watch
    bool prefix = 3;
}

//watch回复
message WatchReply{
    string key = 1;
    string value = 2;
    int64 revision = 3;
    string type = 4;
    ErrorType err = 5;
    int64 leader_id = 6;
}

//put请求
message PutRequest {
    string key = 1;
    string value = 2;
    int64 request_id = 3;
    int64 client_id = 4;
    int64 expected_version = 5;
    int64 expire_at = 6;//TTL 秒数，自动创建 lease 并绑定
    int64 lease_id = 7;//绑定到已有 lease，优先级高于 expire_at
}

//put回复
message PutReply {
  ErrorType error = 1;
  int64  leader_id = 2;
  int64 version = 3;
}

message GetRequest {
    string key = 1;
    int64 request_id = 2;
    int64 client_id = 3;
    int64 version = 4;
    bool prefix = 5;//是否按前缀查询
}

message KeyValue{
    string key = 1;
    string value = 2;
    int64 version = 3;
}

message GetReply {
    repeated KeyValue kvs = 1;
    ErrorType error = 2;
    int64 leader_id = 3;
    int64 Version = 4;
}

//删除请求
message DeleteRequest{
    string key = 1;
    int64 request_id = 2;
    int64 client_id = 3;
}

message DeleteReply{
    ErrorType error = 1;
    int64 leader_id = 2;
    int64 version = 3;
}

//compact请求
message CompactRequest{
    int64 revision = 1;//compact到这个版本
    int64 client_id = 2;
    int64 request_id = 3;
}

message CompactReply{
    ErrorType error = 1;
    int64 leader_id = 2;
}

//keepalive请求
message KeepAliveRequest{
    string key = 1;
}

//keepalive回复
message KeepAliveReply{
    ErrorType error = 1;
    int64 leader_id = 2;
}

//创建 lease
message GrantRequest{
    int64 ttl = 1;
}

message GrantReply{
    ErrorType error = 1;
    int64 leader_id = 2;
    int64 lease_id = 3;
}

message Entry{
    string type = 1;
    string key = 2;
    string value = 3;
    int64 expire_at = 4;//过期时间
    int64 lease_id = 5;
}

//客户端批量提交
message BatchRequest{
    repeated Entry entries = 1;
    int64 client_id = 2;
    int64 request_id = 3;
}

message BatchReply{
     bool success = 1;
     ErrorType error = 2;
     int64 leader_id = 3;
}

//添加集群成员
message AddMemberRequest {
    int32 id = 1;
    string address = 2;
}

message AddMemberReply {
    ErrorType error = 1;
    int64 leader_id = 2;
}

message Memberchange {
    int32 id = 1;
    string address = 2;
    string type = 3;
}

//移除集群成员
message DeleteMemberRequest {
    int32 id = 1;
    string address = 2;
}

message DeleteMemberReply {
    ErrorType error = 1;
    int64 leader_id = 2;
}
 
message RequestVoteArgs {
    int32 term = 1;
    int32 candidate_id = 2;
    int32 last_log_index = 3;
    int32 last_log_term = 4;
}

message RequestVoteReply {
    int32 term = 1;
    bool vote_granted = 2;
}
message LogEntry {
  int64 term = 1;
  bytes command = 2;
}

message HeartbeatArgs {
    int32 leader_id = 1;
    int32 leader_term = 2;

    int32 pre_log_index = 3;
    int32 pre_log_term = 4;

    repeated LogEntry entries = 5;

    int32 leader_commit_index = 6;
}

message HeartbeatReply {
    bool success = 1;
    int32 term = 2;
    int32 conflict_index = 3;
}
message InstallSnapshotArgs {
    int32 term = 1;
    int32 leader_id = 2;

    int32 last_snap_index = 3;
    int32 last_snap_term = 4;

    bytes data = 5;
}

message InstallSnapshotReply {
    int32 term = 1;
}

message Op {
    string type = 1;
    string key = 2;
    string value = 3;
    int64 client_id = 4;
    int64 request_id = 5;
    int64 expected_version = 6;
    int64 expire_at = 7;
    //batch
    repeated Entry entries = 8; 
    //lease
    int64 lease_id = 9;
    //member_change
    Memberchange  member_change = 10;
    //txn
    repeated Compare compares = 11;
    repeated Entry success_entries = 12;
    repeated Entry failed_entries = 13;
}
